<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>Create Account - Book Store</title>
</head>
<body>
    <div style="width: 350px; margin: 40px auto; border: 1px solid #000; padding: 25px; font-family: sans-serif;">
        
        <!-- Step 1: Registration Form -->
        <div id="stepRegister">
            <h3 style="text-align: center; margin-top: 0;">Create Account</h3>
            
            <form id="regForm" onsubmit="handleRegister(event)">
                <p>
                    <label>Name</label><br>
                    <input type="text" id="name" required style="width: 100%; box-sizing: border-box; padding: 7px; margin-top: 4px;">
                </p>
                <p>
                    <label>Email (รับรหัส PIN ทาง Gmail)</label><br>
                    <input type="email" id="email" required style="width: 100%; box-sizing: border-box; padding: 7px; margin-top: 4px;">
                </p>
                <p>
                    <label>Password</label><br>
                    <input type="password" id="password" required style="width: 100%; box-sizing: border-box; padding: 7px; margin-top: 4px;">
                </p>
                <p style="text-align: center; margin-top: 20px;">
                    <button type="submit" id="regBtn" style="padding: 8px 24px; font-size: 14px; cursor: pointer;">Register</button>
                </p>
            </form>
        </div>

        <!-- Step 2: 4-digit PIN Verification Form -->
        <div id="stepVerify" style="display: none;">
            <h3 style="text-align: center; margin-top: 0; color: #0d6efd;">Email Verification</h3>
            <p style="font-size: 13px; text-align: center; line-height: 1.5;">
                ระบบได้ส่งรหัส <b>PIN 4 หลัก</b> ไปยัง<br>
                <b id="targetEmailDisplay" style="color: #0d6efd;"></b><br>
                กรุณาตรวจสอบกล่องจดหมายแล้วนำรหัสมากรอกด้านล่าง:
            </p>

            <form id="pinForm" onsubmit="handleVerifyPIN(event)">
                <div style="text-align: center; margin: 15px 0;">
                    <label style="font-size: 13px; font-weight: bold;">Enter 4-Digit PIN</label><br>
                    <input type="text" id="pinInput" maxlength="4" required 
                           pattern="[0-9]{4}" placeholder="0000"
                           style="width: 160px; font-size: 28px; text-align: center; letter-spacing: 10px; font-weight: bold; padding: 8px; margin-top: 8px; border: 2px solid #0d6efd; border-radius: 4px;">
                </div>
                <p style="text-align: center; margin-top: 15px;">
                    <button type="submit" id="verifyBtn" style="padding: 8px 24px; font-size: 14px; background: #198754; color: white; border: none; border-radius: 4px; cursor: pointer;">Verify PIN & Login</button>
                </p>
            </form>
        </div>

        <div id="resultBox" style="margin-top: 15px; font-size: 13px;"></div>

        <hr style="margin-top: 20px;">
        <p style="text-align: center; font-size: 13px; margin-bottom: 0;">
            Already have an account? <a href="/login/">Login here</a>
        </p>
    </div>

    <script>
        let registeredEmail = '';

        async function handleRegister(e) {
            e.preventDefault();
            const resBox = document.getElementById('resultBox');
            const regBtn = document.getElementById('regBtn');
            regBtn.disabled = true;
            regBtn.innerText = 'Sending email...';
            resBox.innerHTML = '<div style="color: #666;">กำลังส่งรหัส PIN ไปยังอีเมลของคุณผ่าน Gmail...</div>';

            registeredEmail = document.getElementById('email').value.trim();
            const payload = {
                name: document.getElementById('name').value.trim(),
                email: registeredEmail,
                password: document.getElementById('password').value
            };

            try {
                const res = await fetch('/api/register/', {
                    method: 'POST',
                    headers: {'Content-Type': 'application/json'},
                    body: JSON.stringify(payload)
                });
                const data = await res.json();

                if (res.ok) {
                    // Switch to PIN verification step
                    document.getElementById('stepRegister').style.display = 'none';
                    document.getElementById('stepVerify').style.display = 'block';
                    document.getElementById('targetEmailDisplay').innerText = registeredEmail;
                    document.getElementById('pinInput').focus();

                    resBox.innerHTML = '<div style="color: green; border: 1px solid #c3e6cb; background: #d4edda; padding: 8px; border-radius: 4px;">'
                        + '✓ ส่งอีเมลสำเร็จ! ตรวจสอบรหัส PIN 4 ตัวในกล่องจดหมายของคุณ'
                        + '</div>';
                } else {
                    regBtn.disabled = false;
                    regBtn.innerText = 'Register';
                    resBox.innerHTML = '<div style="color: red; border: 1px solid #f5c6cb; background: #f8d7da; padding: 8px; border-radius: 4px;">'
                        + (data.error || JSON.stringify(data))
                        + '</div>';
                }
            } catch (err) {
                regBtn.disabled = false;
                regBtn.innerText = 'Register';
                resBox.innerHTML = '<div style="color: red;">Network error: ' + err.message + '</div>';
            }
        }

        async function handleVerifyPIN(e) {
            e.preventDefault();
            const pinVal = document.getElementById('pinInput').value.trim();
            const resBox = document.getElementById('resultBox');
            const verifyBtn = document.getElementById('verifyBtn');
            verifyBtn.disabled = true;
            verifyBtn.innerText = 'Verifying...';

            try {
                const res = await fetch('/api/verify/', {
                    method: 'POST',
                    headers: {'Content-Type': 'application/json'},
                    body: JSON.stringify({
                        email: registeredEmail,
                        pin: pinVal
                    })
                });
                const data = await res.json();

                if (res.ok) {
                    resBox.innerHTML = '<div style="color: green; border: 1px solid #c3e6cb; background: #d4edda; padding: 10px; border-radius: 4px; text-align: center;">'
                        + '<b>ยืนยันสำเร็จ! ✓</b><br>'
                        + 'กำลังพาท่านไปหน้า Login...'
                        + '</div>';
                    setTimeout(() => {
                        window.location.href = '/login/';
                    }, 1200);
                } else {
                    verifyBtn.disabled = false;
                    verifyBtn.innerText = 'Verify PIN & Login';
                    resBox.innerHTML = '<div style="color: red; border: 1px solid #f5c6cb; background: #f8d7da; padding: 8px; border-radius: 4px; text-align: center;">'
                        + '<b>รหัส PIN ไม่ถูกต้อง:</b> ' + (data.error || 'กรุณาลองใหม่อีกครั้ง')
                        + '</div>';
                }
            } catch (err) {
                verifyBtn.disabled = false;
                verifyBtn.innerText = 'Verify PIN & Login';
                resBox.innerHTML = '<div style="color: red;">Network error: ' + err.message + '</div>';
            }
        }
    </script>
</body>
</html>
