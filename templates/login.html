<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>Login - Book Store</title>
</head>
<body>
    <div style="width: 320px; margin: 40px auto; border: 1px solid #000; padding: 20px; font-family: sans-serif;">
        <h3 style="text-align: center; margin-top: 0;">Login</h3>
        
        <form id="logForm" onsubmit="handleLogin(event)">
            <p>
                <label>Email</label><br>
                <input type="email" id="email" required style="width: 100%; box-sizing: border-box; padding: 6px;">
            </p>
            <p>
                <label>Password</label><br>
                <input type="password" id="password" required style="width: 100%; box-sizing: border-box; padding: 6px;">
            </p>
            <p style="text-align: center; margin-top: 20px;">
                <button type="submit" style="padding: 6px 20px;">Login</button>
            </p>
        </form>

        <div id="resultBox" style="margin-top: 15px; font-size: 13px;"></div>
        <hr>
        <p style="text-align: center; font-size: 13px;">
            Don't have an account? <a href="/register/">Register here</a>
        </p>
    </div>

    <script>
        async function handleLogin(e) {
            e.preventDefault();
            const resBox = document.getElementById('resultBox');
            resBox.innerHTML = 'Verifying credentials...';

            const payload = {
                email: document.getElementById('email').value,
                password: document.getElementById('password').value
            };

            try {
                const res = await fetch('/api/login/', {
                    method: 'POST',
                    headers: {'Content-Type': 'application/json'},
                    body: JSON.stringify(payload)
                });
                const data = await res.json();

                if (res.ok) {
                    // Store JWT in localStorage & sessionStorage
                    const accessToken = data.access || (data.tokens && data.tokens.access) || data.token;
                    const refreshToken = data.refresh || (data.tokens && data.tokens.refresh);
                    if (accessToken) {
                        localStorage.setItem('token', accessToken);
                        localStorage.setItem('access_token', accessToken);
                        sessionStorage.setItem('token', accessToken);
                        sessionStorage.setItem('access_token', accessToken);
                        sessionStorage.setItem('original_valid_token', accessToken);
                        localStorage.setItem('original_valid_token', accessToken);
                    }
                    if (refreshToken) {
                        localStorage.setItem('refresh_token', refreshToken);
                        sessionStorage.setItem('refresh_token', refreshToken);
                    }
                    if (data.user && data.user.role) {
                        localStorage.setItem('user_role', data.user.role);
                        sessionStorage.setItem('user_role', data.user.role);
                    }

                    resBox.innerHTML = '<div style="color: green; background: #e8f5e9; border: 1px solid #c8e6c9; padding: 10px; border-radius: 4px;">'
                        + '<b>Login Success!</b> Welcome ' + (data.user ? data.user.name : '') + ' (Role: <b>' + (data.user ? data.user.role : 'viewer') + '</b>)<br>'
                        + '<div style="margin-top: 6px; font-size: 11px; color: #2e7d32; word-break: break-all;">'
                        + '<b>JWT Access Token:</b><br>' + (accessToken ? accessToken.substring(0, 40) + '...' : 'None')
                        + '</div>'
                        + '<div style="margin-top: 6px; font-size: 12px;">Redirecting to Book Management...</div>'
                        + '</div>';
                    setTimeout(() => {
                        window.location.href = '/';
                    }, 1200);
                } else {
                    resBox.innerHTML = '<div style="color: red; border: 1px dashed red; padding: 8px;">'
                        + '<b>Login Failed:</b><br>'
                        + (data.error || JSON.stringify(data))
                        + '</div>';
                }
            } catch (err) {
                resBox.innerHTML = '<div style="color: red;">Network error: ' + err.message + '</div>';
            }
        }
    </script>
</body>
</html>
